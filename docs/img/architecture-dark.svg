<text x="740" y="449" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">OpenAI API</text>
<text x="740" y="466" font-size="11.5" fill="#c3c2b7" text-anchor="middle">OPENAI_MODEL</text>
<rect x="640" y="494" width="200" height="56" rx="8" fill="#25221d" stroke="#4a4336" stroke-width="1.2"/>
<text x="740" y="519" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">TypeSafe Jev API</text>
<text x="740" y="536" font-size="11.5" fill="#c3c2b7" text-anchor="middle">System One</text>
<path d="M542,452 L640,452" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M542,522 L640,522" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="38" y="630" width="242" height="64" rx="8" fill="#25221d" stroke="#4a4336" stroke-width="1.2"/>
