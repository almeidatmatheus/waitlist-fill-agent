<text x="159" y="676" font-size="11.5" fill="#c3c2b7" text-anchor="middle">via outlook-calendar-lite-mcp (ls, cr, ed, ntf)</text>
<rect x="300" y="630" width="242" height="64" rx="8" fill="#25221d" stroke="#4a4336" stroke-width="1.2"/>
<text x="421" y="659" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">PostgreSQL</text>
<text x="421" y="676" font-size="11.5" fill="#c3c2b7" text-anchor="middle">business data + LangGraph checkpoints</text>
