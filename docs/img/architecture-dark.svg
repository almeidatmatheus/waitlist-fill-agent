<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" width="860" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="System architecture of waitlist-fill-agent">
<title>System architecture of waitlist-fill-agent</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8d8c85"/></marker></defs>
<rect width="100%" height="100%" fill="#1a1a19"/>
<rect x="20" y="20" width="540" height="560" rx="12" fill="#1c2735" stroke="#3987e5" stroke-width="1.5"/>
<text x="34" y="42" font-size="12.5" font-weight="600" fill="#3987e5">waitlist-fill-agent  (Node.js, TypeScript, Fastify)</text>
<text x="38" y="64" font-size="10.5" font-weight="600" fill="#c3c2b7" text-anchor="start">TRIGGERS</text>
<rect x="38" y="74" width="116" height="64" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="96" y="95.5" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Detector</text>
<text x="96" y="112.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">lists the calendar:</text>
<text x="96" y="127.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">notice or timer</text>
<rect x="164" y="74" width="116" height="64" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="222" y="95.5" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Sweeper</text>
<text x="222" y="112.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">expiry, retries,</text>
<text x="222" y="127.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">reconciliation</text>
<rect x="300" y="74" width="242" height="64" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="421" y="103" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Inbound webhook</text>
<text x="421" y="120" font-size="11.5" fill="#c3c2b7" text-anchor="middle">HMAC check, dedup, routing</text>
<rect x="38" y="214" width="242" height="92" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="159" y="249.5" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Recovery workflow</text>
<text x="159" y="266.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">LangGraph, one thread per freed slot:</text>
<text x="159" y="281.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">find patient → offer → book</text>
<rect x="300" y="214" width="242" height="92" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="421" y="249.5" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Patient assistant</text>
<text x="421" y="266.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">LangGraph function-calling agent:</text>
<text x="421" y="281.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">cancel, reschedule, questions</text>
<path d="M96,138 L96,214" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="73.7" y="167" width="44.599999999999994" height="16" rx="3" fill="#1a1a19" opacity="0.92"/>
<text x="96" y="179" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">starts</text>
<path d="M222,138 L222,214" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="196.65" y="167" width="50.699999999999996" height="16" rx="3" fill="#1a1a19" opacity="0.92"/>
<text x="222" y="179" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">resumes</text>
<path d="M470,138 L470,214" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="426.35" y="167" width="87.3" height="16" rx="3" fill="#1a1a19" opacity="0.92"/>
<text x="470" y="179" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">anything else</text>
<path d="M340,138 L340,162 L268,162 L268,214" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="348" y="166" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">reply to an offer</text>
<text x="38" y="332" font-size="10.5" font-weight="600" fill="#c3c2b7" text-anchor="start">DECISIONS AND RULES</text>
<rect x="32" y="340" width="516" height="222" rx="10" fill="none" stroke="#3a3935" stroke-dasharray="4 4"/>
<path d="M250,306 L250,340" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M421,306 L421,340" fill="none" stroke="#8d8c85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="38" y="352" width="242" height="198" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="159" y="418" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Deterministic core</text>
<text x="159" y="435" font-size="11.5" fill="#c3c2b7" text-anchor="middle">eligibility and priority</text>
<text x="159" y="450" font-size="11.5" fill="#c3c2b7" text-anchor="middle">availability (live calendar)</text>
<text x="159" y="465" font-size="11.5" fill="#c3c2b7" text-anchor="middle">booking state machine</text>
<text x="159" y="480" font-size="11.5" fill="#c3c2b7" text-anchor="middle">confirmation gate</text>
<text x="159" y="495" font-size="11.5" fill="#c3c2b7" text-anchor="middle">guardrails, human handoff</text>
<rect x="300" y="352" width="242" height="62" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="421" y="380" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Language decisions</text>
<text x="421" y="397" font-size="11.5" fill="#c3c2b7" text-anchor="middle">what does the patient mean? a clear yes?</text>
<rect x="300" y="424" width="242" height="56" rx="8" fill="#242422" stroke="#3d3c38" stroke-width="1.2"/>
<text x="421" y="449" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">LLM</text>
<text x="421" y="466" font-size="11.5" fill="#c3c2b7" text-anchor="middle">agent reasoning and replies; Jev fallback</text>
<rect x="300" y="494" width="242" height="56" rx="8" fill="#18281f" stroke="#199e70" stroke-width="1.2"/>
<text x="421" y="519" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Jev</text>
<text x="421" y="536" font-size="11.5" fill="#c3c2b7" text-anchor="middle">fast typed decisions with confidence</text>
<rect x="640" y="60" width="200" height="56" rx="8" fill="#25221d" stroke="#4a4336" stroke-width="1.2"/>
<text x="740" y="85" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">Patient</text>
<text x="740" y="102" font-size="11.5" fill="#c3c2b7" text-anchor="middle">WhatsApp on a phone</text>
<rect x="640" y="160" width="200" height="80" rx="8" fill="#25221d" stroke="#4a4336" stroke-width="1.2"/>
<text x="740" y="189.5" font-size="13" font-weight="600" fill="#f0efec" text-anchor="middle">WA-AKG gateway</text>
<text x="740" y="206.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">WhatsApp REST API</text>
<text x="740" y="221.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">+ signed webhooks</text>
