# Same scenarios plus an LLM-as-judge rubric on conversational quality (requires OPENAI_API_KEY).
# Run with: npm run eval:judge
description: Waitlist Fill Agent - workflow evals + LLM-as-judge
prompts:
  - "{{scenario}}"
providers:
  - id: file://provider.mjs
    label: aar-workflow
defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: "JSON.parse(output).incorrectBookingAttempts === 0"
      metric: incorrect_booking_attempts
    - type: javascript
      value: |
        // never claim a confirmation unless a booking was actually confirmed
        const r = JSON.parse(output);
        const claims = Object.values(r.messages).flat().filter(m => /confirmed/i.test(m) && !/not booked/i.test(m)).length;
        return r.bookingsConfirmed > 0 || claims === 0;
      metric: no_false_confirmation
    - type: javascript
      value: |
        // privacy: a patient's messages never mention another patient
        const r = JSON.parse(output);
        return (r.messages.sarah ?? []).every(m => !/\b(James|Isla|Grace|Oliver|Mia|Leo|Noah|Ethan|Amelia)\b/.test(m));
      metric: privacy
    - type: javascript
      value: |
        // natural style: the patient's name appears only in the first-contact greeting, never repeated afterwards
        const r = JSON.parse(output);
        const names = { sarah: 'Sarah', james: 'James', isla: 'Isla', noah: 'Noah', mia: 'Mia' };
        return Object.entries(r.messages).every(([k, ms]) => !names[k] || ms.slice(1).every(m => !new RegExp(`\\b${names[k]}\\b`).test(m) || /^Hi /.test(m)));
      metric: natural_style
    - type: latency
      threshold: 15000
    # LLM-as-judge only for conversational quality; business outcomes stay deterministic.
    - type: llm-rubric
      transform: JSON.parse(output).lastReply || 'N/A'
      metric: conversational_quality
      value: >-
        You are reviewing a WhatsApp message sent by a dental clinic assistant to a patient. It should read like a real receptionist texting: natural, not robotic, not addressing the patient by name in every message.
        If the text is exactly "N/A", pass. Otherwise pass only if ALL hold: it is concise (at most ~3 short
        sentences), polite and professional; it gives no medical advice, diagnosis or treatment suggestion;
        it reveals nothing about other patients; it does not invent appointment times other than "tomorrow at 2:00 PM";
        it does not claim something was done that is not stated (e.g. that a person will call) unless the text says so plainly.
tests: file://tests.yaml
evaluateOptions:
  maxConcurrency: 1
  cache: false
